<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs - TempDev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .log-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .log-search {
      flex: 1;
      max-width: 400px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 13px;
      outline: none;
    }
    .log-search:focus { border-color: var(--blue); }
    .log-filter-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      font-size: 12px;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all 0.15s;
    }
    .log-filter-btn:hover { background: #f5f5f5; }
    .log-filter-btn.active { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
    .log-table {
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .log-table td { padding: 8px 10px; vertical-align: top; }
    .log-table tr { border-bottom: 1px solid var(--border-light); }
    .log-table tr:hover { background: #fafafa; }
    .log-level {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .log-level.info { background: var(--blue-light); color: var(--blue); }
    .log-level.warn { background: var(--yellow-bg); color: var(--yellow); }
    .log-level.error { background: var(--red-bg); color: var(--red); }
    .log-time { color: var(--text-muted); white-space: nowrap; }
    .log-event { font-weight: 600; color: var(--text); }
    .log-env { color: var(--blue); }
    .log-detail { color: var(--text-secondary); }
    .log-count {
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body>
  <div id="topbar-root"></div>
  <div id="sidebar-root"></div>

  <main class="main">
    <div class="page active">
      <div class="page-header">
        <div class="page-breadcrumb">
          <a href="/pages/dashboard.html">Home</a>
          <span class="sep">&#9656;</span>
          <span>Logs</span>
        </div>
        <h1 class="page-title">Event Logs</h1>
        <p class="page-desc">System events, environment actions, and audit trail</p>
      </div>

      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="card-title">Events</div>
            <span class="log-count" id="log-count">0 events</span>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="loadLogs()">Refresh</button>
        </div>

        <div class="card-body" style="padding:12px 16px;border-bottom:1px solid var(--border);">
          <div class="log-toolbar">
            <input type="text" class="log-search" id="log-search" placeholder="Search events, env IDs..." onkeyup="debounceSearch()">
            <button class="log-filter-btn active" data-filter="" onclick="setFilter(this)">All</button>
            <button class="log-filter-btn" data-filter="env_created" onclick="setFilter(this)">Created</button>
            <button class="log-filter-btn" data-filter="env_deleted" onclick="setFilter(this)">Deleted</button>
            <button class="log-filter-btn" data-filter="tunnel" onclick="setFilter(this)">Tunnels</button>
            <button class="log-filter-btn" data-filter="abuse" onclick="setFilter(this)">Abuse</button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="log-table">
            <thead>
              <tr>
                <th style="width:160px;">Time</th>
                <th style="width:70px;">Level</th>
                <th style="width:160px;">Event</th>
                <th style="width:100px;">Env ID</th>
                <th>Detail</th>
              </tr>
            </thead>
            <tbody id="log-body">
              <tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:40px;">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/shell.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/location.js"></script>
  <script>
    let currentFilter = '';
    let searchTimeout = null;

    async function loadLogs(filter) {
      if (filter !== undefined) currentFilter = filter;
      const search = document.getElementById('log-search').value;
      const q = search || currentFilter;
      try {
        const r = await fetch(`/logs?filter=${encodeURIComponent(q)}&limit=200`);
        const logs = await r.json();

        document.getElementById('log-count').textContent = `${logs.length} event${logs.length !== 1 ? 's' : ''}`;

        if (!logs || logs.length === 0) {
          document.getElementById('log-body').innerHTML =
            '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:40px;">No events found</td></tr>';
          return;
        }

        document.getElementById('log-body').innerHTML = logs.map(l => {
          const d = new Date(l.created_at);
          const time = d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
          const level = l.level || 'info';
          return `<tr>
            <td class="log-time">${time}</td>
            <td><span class="log-level ${level}">${level}</span></td>
            <td class="log-event">${l.event}</td>
            <td class="log-env">${l.env_id || '-'}</td>
            <td class="log-detail">${l.detail || ''}</td>
          </tr>`;
        }).join('');
      } catch (e) {
        console.error('Failed to load logs:', e);
      }
    }

    function setFilter(el) {
      document.querySelectorAll('.log-filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('log-search').value = '';
      loadLogs(el.dataset.filter);
    }

    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        document.querySelectorAll('.log-filter-btn').forEach(b => b.classList.remove('active'));
        loadLogs('');
      }, 300);
    }

    loadLogs();
    setInterval(() => loadLogs(), 15000);
  </script>
</body>
</html>
